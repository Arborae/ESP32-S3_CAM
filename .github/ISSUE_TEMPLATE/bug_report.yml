name: Bug report
description: Report a problem or unexpected behavior
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Bug description
      description: Explain what happens and what you expected
      placeholder: Clear and concise description...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      value: |
        1. Start the container with ...
        2. Open ...
        3. Observe ...
  - type: textarea
    attributes:
      label: Relevant logs/output
      description: Paste container logs or screenshots here
      render: bash
  - type: input
    attributes:
      label: Version/commit
      description: Image tag or commit SHA
  - type: input
    attributes:
      label: Platform
      description: OS/architecture (e.g. Ubuntu 22.04 amd64, RPi4 arm64)
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I searched for similar issues
        - label: I removed sensitive data from logs
