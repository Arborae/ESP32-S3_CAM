name: Feature request
description: Propose a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem to solve / Motivation
      description: What problem does it solve? Why is it needed?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: Describe how it should work: API/UI, MQTT, etc.
  - type: textarea
    attributes:
      label: Alternatives considered
  - type: textarea
    attributes:
      label: Extra (mockups, screenshots, HA automation examples, etc.)
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I'm available to contribute to the PR
        - label: I checked it doesn't already exist
